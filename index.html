<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Trading Solutions LLC</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #080d14;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .hero-container {
            text-align: center;
            padding: 2rem;
        }

        .sphere-wrapper {
            position: relative;
            width: 320px;
            height: 320px;
            margin: 0 auto 2rem auto;
            display: flex;
            justify-content: center;
            align-items: center;
            perspective: 1000px;
        }

        .sphere {
            width: 220px;
            height: 220px;
            border-radius: 50%;
            position: relative;
            z-index: 2;
            background-image: url('logo.png');
            background-size: cover;
            background-position: center;
            box-shadow: 0 0 40px rgba(0, 180, 255, 0.4), inset 0 0 25px rgba(0, 0, 0, 0.85);
        }

        .orbit-ring {
            position: absolute;
            width: 340px;
            height: 340px;
            border-radius: 50%;
            border: 4px solid rgba(212, 175, 55, 0.85);
            box-shadow: 
                0 0 20px rgba(0, 195, 255, 0.7),
                inset 0 0 15px rgba(0, 195, 255, 0.5);
            transform: rotateX(75deg) rotateY(-20deg);
            transform-style: preserve-3d;
            pointer-events: none;
            z-index: 3;
            animation: orbitRotate 8s linear infinite;
        }

        .orbit-ring::after {
            content: '';
            position: absolute;
            top: -8px;
            left: -8px;
            right: -8px;
            bottom: -8px;
            border-radius: 50%;
            border: 2px solid rgba(0, 212, 255, 0.6);
            filter: blur(1px);
        }

        @keyframes orbitRotate {
            0% {
                transform: rotateX(75deg) rotateY(-20deg) rotateZ(0deg);
            }
            100% {
                transform: rotateX(75deg) rotateY(-20deg) rotateZ(360deg);
            }
        }

        h1 {
            font-size: 2.2rem;
            letter-spacing: 1px;
            background: linear-gradient(135deg, #f3e7c4 0%, #d4af37 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
        }

        p {
            color: #00d4ff;
            font-size: 0.95rem;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
    </style>
</head>
<body>
    <div class="hero-container">
        <div class="sphere-wrapper">
            <div class="orbit-ring"></div>
            <div class="sphere"></div>
        </div>
        <h1>Global Trading Solutions LLC</h1>
        <p>Parent Entity | Commercial Trade | Portfolio Operations</p>
    </div>
</body>
</html>
